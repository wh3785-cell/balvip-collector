name: collect

on:
  schedule:
    - cron: "5 21 * * 1-5"   # 한국시간 화~토 06:05 (미국장 마감 후)
    - cron: "5 7 * * 1-5"    # 한국시간 월~금 16:05 (한국장 마감 후)
  workflow_dispatch: {}      # Actions 화면에서 직접 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py
      - name: Save
        run: |
          git config user.name "balvip-bot"
          git config user.email "balvip-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
