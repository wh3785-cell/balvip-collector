name: collect

on:
  schedule:
    - cron: "15 21 * * 1-5"   # 한국시간 화~토 06:15 (야간 세션 끝난 뒤)
    - cron: "40 23 * * 0-4"   # 한국시간 월~금 08:40 (개장 직전)
    - cron: "35 6 * * 1-5"    # 한국시간 월~금 15:35 (주간 장 마감 직후)
    - cron: "30 13 * * 1-5"   # 한국시간 월~금 22:30 (미국장 초반·야간장 진행 중)
  workflow_dispatch: {}       # Actions 화면에서 직접 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect.py
      - name: Save
        run: |
          git config user.name "balvip-bot"
          git config user.email "balvip-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
